# This file exists for two reasons.
#
# 1. ISOLATION. The anchor monorepo has its own pnpm-workspace.yaml two levels
#    up. Without a workspace root of its own, splash/ gets swallowed by it and
#    resolves dependencies against the wrong tree. pnpm stops at the nearest
#    workspace root, so this file is what keeps the splash self-contained —
#    the package-isolation discipline from the maintain-splash-pages skill.
#
# 2. BUILD SCRIPTS. pnpm blocks dependency build scripts by default; sharp and
#    esbuild both need theirs to produce working binaries.
#
# `packages:` is required by pnpm 9, which errors "packages field missing or
# empty" on a workspace file that carries only settings. pnpm 10 tolerates its
# absence — which is why this built locally on pnpm 10 and failed in CI on 9.
# Declaring it keeps the file valid on both.
packages:
  - '.'

onlyBuiltDependencies:
  - esbuild
  - sharp
