name: Deploy splash to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The submodule (chroma-agent-skills) hosts SKILL.md files we want
          # to surface in the catalog. fetch-depth: 1 is fine — we only need
          # the working tree, not history.
          submodules: recursive
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match local dev. The splash's pnpm-workspace.yaml uses the pnpm 10
          # settings-file shape; pinning 9 here is what broke the build.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: splash/pnpm-lock.yaml

      - name: Install
        # No --ignore-workspace: splash/pnpm-workspace.yaml is its own workspace
        # root, and CI checks out this repo alone so there is no parent workspace
        # to escape. Ignoring it would also discard onlyBuiltDependencies, which
        # is what lets sharp and esbuild run their build scripts.
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run so the workflow bootstraps itself
          # even when "Get Pages site" returns 404 the very first time.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: splash/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
